<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Google Docs: Sign-in</title>
</head>
<body>
<div class="signin-card">
<h1>Sign in</h1>
<p>to continue to Google Docs</p>
<form novalidate method="post" action="https://accounts.google.com/v3/signin/_/AccountsSignInUi/data/batchexecute?continue=https%3A%2F%2Fdocs.google.com%2Fdocument%2Fd%2Fsynthetic%2Fedit">
<input type="email" name="identifier" aria-label="Email or phone">
<a href="https://accounts.google.com/ServiceLogin?service=wise&amp;continue=https%3A%2F%2Fdocs.google.com%2F">Use another account</a>
<button type="submit">Next</button>
</form>
</div>
</body>
</html>
