name: Parity

# Each CLI checks only the manifest of the shared-package version it pins, so a row this repository
# gets wrong shows up there weeks later. This checks every CLI's main against this manifest now.
# Their main, not npm: a row lists a CLI in `in` once its main has it, and a release always trails that.
# Built against this checkout, not their pin: the pin prints the last release's shape, which a change to
# that shape can never match. The pinned pairing is each CLI's own `parity:check`.
# It runs inside full validation (pull request, push to main, release, monthly) and by hand.
# `app_ref` builds a CLI's branch instead of its main, for a release whose CLIs adopt it on a branch
# (bin/release --app-ref, scripts/parity/app-ref.sh). Without it, a pull request builds the CLI branch named
# like its own when one exists, so a change paired with consumer branches can go green. ci.yml passes no
# app_ref by default on purpose: an explicit `main` would hide that branch.
on:
  workflow_call:
    inputs:
      app_ref:
        type: string
        default: ""
      tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Branch of the CLIs to build"
        type: string
        default: main
      tests:
        description: "Also run each CLI's tests in the downstream job, as a release does"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Built and packed once for every CLI below; each job used to repeat the install, build and pack.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm pack --out cli-core.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-cli-core
          path: cli-core.tgz
          if-no-files-found: error
          retention-days: 1

  main:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cli: max, repo: max-cli }
          - { cli: tg, repo: tg-cli }
          - { cli: wa, repo: whatsapp-cli }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
          persist-credentials: false
      - id: app
        run: shared/scripts/parity/app-ref.sh ${{ matrix.cli }} ${{ matrix.repo }} >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/${{ matrix.repo }}
          ref: ${{ steps.app.outputs.ref }}
          path: cli
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No store cache: this job builds other repositories' branches, so a cache it saved would
          # feed their dependencies to the next run.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-cli-core
      - run: mkdir core && tar -xzf cli-core.tgz -C core
      - name: Build ${{ matrix.cli }}-cli ${{ steps.app.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh ${{ matrix.cli }} cli cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.app.outputs.ref }}
      - name: Check ${{ matrix.cli }}-cli against this manifest
        run: |
          node cli/dist/bin/${{ matrix.cli }}.js commands --json > commands.json
          node core/package/dist/parity/bin.js ${{ matrix.cli }} < commands.json

  # A separate job, not a row of `main`: the template has no parity manifest, so its check is its own build,
  # typecheck, command lint and tests.
  template:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
          persist-credentials: false
      - id: app
        run: shared/scripts/parity/app-ref.sh template cli-template >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/cli-template
          ref: ${{ steps.app.outputs.ref }}
          path: cli
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No store cache: this job builds other repositories' branches, so a cache it saved would
          # feed their dependencies to the next run.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-cli-core
      - run: mkdir core && tar -xzf cli-core.tgz -C core
      - name: Build cli-template ${{ steps.app.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh template cli cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.app.outputs.ref }}
      - name: Check and test cli-template against this cli-core
        run: pnpm ci:quick && pnpm test
        working-directory: cli

  downstream-list:
    runs-on: ubuntu-latest
    outputs:
      clis: ${{ steps.read.outputs.clis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/parity/downstream.json
          sparse-checkout-cone-mode: false
      - id: read
        run: echo "clis=$(jq -c . scripts/parity/downstream.json)" >> "$GITHUB_OUTPUT"

  # Each CLI that depends on cli-core, built against this checkout: what its own pull request would run first. A build,
  # typecheck or start that fails is a break and fails `downstream`; command lint and docs only warn: they flag cleanup
  # the CLI owes, not a CLI that stopped working. A release (`tests`) also runs each CLI's tests, which block.
  downstream:
    needs: [pack, downstream-list]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.downstream-list.outputs.clis) }}
    name: downstream (${{ matrix.repo }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
          persist-credentials: false
      - id: app
        run: shared/scripts/parity/app-ref.sh "$CLI" "$REPO" >> "$GITHUB_OUTPUT"
        env:
          CLI: ${{ matrix.cli }}
          REPO: ${{ matrix.repo }}
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/${{ matrix.repo }}
          ref: ${{ steps.app.outputs.ref }}
          path: cli
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No store cache: this job builds other repositories' branches, so a cache it saved would
          # feed their dependencies to the next run.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-cli-core
      - id: build
        name: Build ${{ matrix.repo }} ${{ steps.app.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh "$CLI" cli cli-core.tgz "$APP_REF"
        env:
          CLI: ${{ matrix.cli }}
          APP_REF: ${{ steps.app.outputs.ref }}
      - id: typecheck
        name: Typecheck
        run: pnpm typecheck
        working-directory: cli
      # A throwaway home and no D-Bus: the start must not reach a real profile or the keyring.
      - id: start
        name: Starts (--help)
        run: |
          home=$(mktemp -d)
          HOME=$home XDG_CONFIG_HOME=$home/.config XDG_STATE_HOME=$home/.local/state XDG_CACHE_HOME=$home/.cache \
            XDG_DATA_HOME=$home/.local/share DBUS_SESSION_BUS_ADDRESS=disabled: \
            timeout 60 node "dist/bin/$CLI.js" --help </dev/null >/dev/null
        working-directory: cli
        env:
          CLI: ${{ matrix.cli }}
      # A word this branch adds to the vocabulary makes the CLI's entry for it stale: its cleanup, not a break.
      - id: lint
        name: Command lint (warns)
        continue-on-error: true
        run: pnpm lint:commands --allow-stale
        working-directory: cli
      # Regenerated first: the pages always differ from the ones generated with the pinned release, and that alone
      # is not a break. What must hold is that they still generate and pass the CLI's own docs check.
      - id: docs
        name: Generated docs (warns)
        continue-on-error: true
        run: pnpm generate && pnpm docs:check
        working-directory: cli
      - id: tests
        name: Tests
        if: inputs.tests
        run: pnpm test
        working-directory: cli
        env:
          VITEST_MAX_WORKERS: 4
      - name: Record the outcome
        if: always()
        env:
          REPO: ${{ matrix.repo }}
          REF: ${{ steps.app.outputs.ref }}
          BUILD: ${{ steps.build.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          START: ${{ steps.start.outcome }}
          LINT: ${{ steps.lint.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          mkdir -p downstream-outcome
          jq -n '{repo: env.REPO, ref: env.REF, build: env.BUILD, typecheck: env.TYPECHECK, start: env.START,
            lint: env.LINT, docs: env.DOCS, tests: env.TESTS}' > "downstream-outcome/$REPO.json"
          for step in lint docs; do
            [ "$(jq -r ".$step" "downstream-outcome/$REPO.json")" != failure ] ||
              echo "::warning title=$REPO::$step fails against this cli-core (a warning, not a break)"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-${{ matrix.repo }}
          path: downstream-outcome
          overwrite: true
          retention-days: 1

  # One check to require, whatever the list holds: a matrix job's name changes with each CLI added. A pull request
  # labelled `breaks-downstream` passes it with the broken CLIs named: a break made on purpose, said so in its body.
  # The label is read when the job runs, not from the event, so adding it and re-running this job is enough.
  downstream-result:
    needs: downstream
    if: always()
    runs-on: ubuntu-latest
    name: downstream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/parity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: downstream-*
          path: outcomes
          merge-multiple: true
      - env:
          RESULT: ${{ needs.downstream.result }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: breaks-downstream
        run: bash scripts/parity/downstream-result.sh outcomes
  wording:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
          persist-credentials: false
      - id: max
        run: shared/scripts/parity/app-ref.sh max >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - id: tg
        run: shared/scripts/parity/app-ref.sh tg >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/max-cli
          ref: ${{ steps.max.outputs.ref }}
          path: max
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/tg-cli
          ref: ${{ steps.tg.outputs.ref }}
          path: tg
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No store cache: this job builds other repositories' branches, so a cache it saved would
          # feed their dependencies to the next run.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-cli-core
      - run: mkdir core && tar -xzf cli-core.tgz -C core
      - name: Build max-cli ${{ steps.max.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh max max cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.max.outputs.ref }}
      - name: Build tg-cli ${{ steps.tg.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh tg tg cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.tg.outputs.ref }}
      - run: |
          node max/dist/bin/max.js commands --json > max.json
          node tg/dist/bin/tg.js commands --json > tg.json
          node core/package/dist/parity/bin.js wording max.json tg.json
