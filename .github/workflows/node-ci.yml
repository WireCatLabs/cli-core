# The checks every CLI on cli-core runs on a pull request, called from each repository's ci.yml:
#
#   jobs:
#     ci:
#       uses: WireCatLabs/cli-core/.github/workflows/node-ci.yml@<tag or sha>
#       with:
#         checks: |
#           pnpm docs:check
#
# Everything runs in the caller's checkout; a job only one repository needs stays in its own ci.yml.
name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      checks:
        description: Shell lines run after lint, typecheck, test:coverage and build, in the same job
        type: string
        default: ""
      bun:
        description: Run the Bun job
        type: boolean
        default: true
      bun-run:
        description: What the Bun job runs once dependencies are installed
        type: string
        default: pnpm smoke:bun

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: checks
        if: inputs.checks != ''
        env:
          CHECKS: ${{ inputs.checks }}
        run: bash -eo pipefail -c "$CHECKS"

  bun:
    if: inputs.bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      # The second runtime, actually executed: a type check proves nothing about a runtime that does
      # not have the module.
      - name: bun
        env:
          BUN_RUN: ${{ inputs.bun-run }}
        run: bash -eo pipefail -c "$BUN_RUN"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Written here rather than read from the same release, which would only prove the two agree.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The binary, not gitleaks-action: the action asks an organisation account for a licence
        # key, and the tool itself is MIT and needs none.
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
