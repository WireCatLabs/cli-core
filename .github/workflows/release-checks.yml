name: Release checks

on:
  workflow_dispatch:
    inputs:
      dependencies:
        type: boolean
        default: true
      languages:
        type: string
        default: '["actions","javascript-typescript"]'
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      dependencies:
        type: boolean
        default: true
      languages:
        type: string
        default: '["actions","javascript-typescript"]'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependencies:
    if: inputs.dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version || '24' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level critical

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        # Noncritical findings are reported for owner review; scanner failures still stop release.
        run: |
          curl -sSfLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz zizmor
          ./zizmor --offline --strict-collection --min-severity high --no-exit-codes .github

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Written here rather than read from the same release, which would only prove the two agree.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The binary, not gitleaks-action: the action asks an organisation account for a licence
        # key, and the tool itself is MIT and needs none.
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages || '["actions","javascript-typescript"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          output: sarif
          upload: false
          category: release/${{ matrix.language }}
      - name: publish source analysis to security alerts
        if: always() && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: sarif
          category: release/${{ matrix.language }}
      - name: critical source findings
        run: |
          python3 - <<'PYCODE'
          import json, pathlib
          reports = list(pathlib.Path("sarif").glob("*.sarif"))
          if not reports:
              raise SystemExit("CodeQL produced no SARIF report")
          critical = 0
          for path in reports:
              for run in json.loads(path.read_text())["runs"]:
                  rules = {rule["id"]: rule for rule in run["tool"]["driver"].get("rules", [])}
                  for result in run.get("results", []):
                      rule = rules.get(result.get("ruleId"), {})
                      score = float(rule.get("properties", {}).get("security-severity", 0))
                      critical += score >= 9
          print(f"CodeQL: {critical} critical findings; other findings require owner review")
          raise SystemExit(1 if critical else 0)
          PYCODE
