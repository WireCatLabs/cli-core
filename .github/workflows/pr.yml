name: Pull request validation

# The full Linux validation before merge, so a pull request that lowers coverage or breaks a contract
# or a consumer's build fails here and not on main (WC-CI-5). ci.yml has no platform suites to skip.
on:
  pull_request:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
