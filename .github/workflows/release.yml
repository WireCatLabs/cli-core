name: Release

# Started by bin/release. npm trusts this file by name (trusted publishing), so there is no npm
# token anywhere in this repository and renaming the file breaks publishing until npm is told.
#
# Full validation builds, checks and packs once; `build` verifies the immutable tarball.
# When the release commit has the tree of its pull request's head and every required check is green there,
# `reuse` skips that validation and `pack` only builds and packs (scripts/release-reuse.sh); the run summary
# says which path ran and why. The npm audits and Parity run on both paths.
# The job able to publish runs no code from our dependencies; `publish` holds the OIDC permission and only
# runs `npm publish` on that file; `tag` is the only one that may write to the repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack, run npm publish --dry-run, do not tag"
        type: boolean
        default: false
      app_ref:
        description: "Branch of tg-cli and max-cli that Parity builds"
        type: string
        default: main
      commit:
        description: "The commit bin/release checked; the run refuses any other"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every job builds github.sha, the tip of main when the run started — which a merge can move past the commit
  # bin/release checked.
  checked-commit:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$COMMIT" = "$GITHUB_SHA" ] && exit 0
          [ "$DRY_RUN" = "true" ] && [ -z "$COMMIT" ] && exit 0
          echo "::error::this run is at $GITHUB_SHA, but bin/release checked '${COMMIT}' — nothing is published"
          exit 1

  reuse:
    needs: checked-commit
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          APP_REF: ${{ inputs.app_ref }}
          # security.yml's checks; the ruleset does not require them yet.
          EXTRA_CONTEXTS: |
            security / workflows
            security / secrets
            security / source (actions)
            security / source (javascript-typescript)
            security / source (python)
            security / source (c-cpp)
            security / source (java-kotlin)
        run: bash scripts/release-reuse.sh

  validation:
    needs: [checked-commit, reuse]
    if: (github.ref == 'refs/heads/main' || inputs.dry_run) && needs.reuse.outputs.reuse != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      pack: true
      app_ref: ${{ inputs.app_ref }}

  checks:
    needs: [checked-commit, reuse]
    if: (github.ref == 'refs/heads/main' || inputs.dry_run) && needs.reuse.outputs.reuse != 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@c187075303a8d2096ded5faf8b5871572c35e8a4 # High production findings and fresh npm resolution
    with:
      languages: '["actions","javascript-typescript","python","c-cpp","java-kotlin"]'

  # The reuse path's share of `checks`: the same two audits as cli-base's release-checks.yml, which cannot run them
  # alone. They read the registry, not this tree, so a pull request's result says nothing about them.
  audits:
    needs: reuse
    if: needs.reuse.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The audit reads only the lockfile; installing would run dependency lifecycle scripts for nothing.
      - run: pnpm audit --prod --audit-level high
      - name: Audit a fresh production install of the package
        run: |
          audit_dir=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$audit_dir" > /dev/null
          cd "$audit_dir"
          npm init --yes > /dev/null
          npm install --package-lock-only --ignore-scripts --omit=dev --no-audit --no-fund "$audit_dir"/*.tgz
          npm audit --omit=dev --audit-level=high

  parity:
    needs: reuse
    if: needs.reuse.outputs.reuse == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/parity.yml
    with:
      app_ref: ${{ inputs.app_ref }}

  # What node-ci.yml's pack step does for the full path: build once, pack once, hand `build` the digest.
  pack:
    needs: reuse
    if: needs.reuse.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the build
        id: package
        run: |
          npm pack --ignore-scripts
          set -- ./*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one package tarball"; exit 1; }
          echo "sha256=$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-package
          path: ./*.tgz
          if-no-files-found: error
          retention-days: 7

  # Exactly one path must have run, and all of it must have passed: a skipped job is success to `needs`.
  gate:
    needs: [reuse, validation, checks, audits, parity, pack]
    if: ${{ always() && (github.ref == 'refs/heads/main' || inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      package-sha256: ${{ needs.validation.outputs.package-sha256 || needs.pack.outputs.package-sha256 }}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          result() { echo "$NEEDS" | jq -r --arg job "$1" '.[$job].result'; }
          [ "$(result reuse)" = success ] || { echo "::error::reuse: $(result reuse)"; exit 1; }
          if [ "$(echo "$NEEDS" | jq -r '.reuse.outputs.reuse')" = true ]; then
            ran="audits parity pack" skipped="validation checks"
          else
            ran="validation checks" skipped="audits parity pack"
          fi
          for job in $ran; do
            [ "$(result "$job")" = success ] || { echo "::error::$job: $(result "$job")"; exit 1; }
          done
          for job in $skipped; do
            [ "$(result "$job")" = skipped ] || { echo "::error::$job should have been skipped: $(result "$job")"; exit 1; }
          done

  build:
    needs: gate
    # A reused release skips validation and checks; without always() that skip would cascade to here.
    if: ${{ always() && needs.gate.result == 'success' && (github.ref == 'refs/heads/main' || inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-package
      - name: Verify validated package integrity
        env:
          EXPECTED_SHA256: ${{ needs.gate.outputs.package-sha256 }}
        run: |
          set -- ./*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one package tarball"; exit 1; }
          [ -n "$EXPECTED_SHA256" ] || { echo "Missing validation digest"; exit 1; }
          printf '%s  %s\n' "$EXPECTED_SHA256" "$1" | sha256sum --check -

      - name: version not yet on npm
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != "true" ] && npm view "@wirecat/cli-core@$version" version --prefer-online >/dev/null 2>&1; then
            echo "::error::$version is already on npm — raise the version first"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: wirecat-cli-core-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  package-dry-run:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Permit checking an already published version; this job has no publishing permissions.
      - run: npm publish ./*.tgz --access public --dry-run --force

  publish:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm, not pnpm: npm's trusted publishing is the documented path. A tarball runs no
      # lifecycle scripts, and nothing is installed here.
      - run: npm publish "wirecat-cli-core-$VERSION.tgz" --access public

      - name: wait for npm to show the version
        if: ${{ !inputs.dry_run }}
        run: |
          # The version's own document, not `npm view`: on 2026-10-01 the document answered while the
          # version list `npm view` reads was still stale for minutes (cli-base 0.13.0 and 0.14.0).
          # npm took 26 minutes to show 0.323.0 and 0.325.0 on 2026-10-17; fifteen left both untagged.
          for _ in $(seq 270); do
            curl -sfo /dev/null "https://registry.npmjs.org/@wirecat%2fcli-core/$VERSION" && exit 0
            sleep 10
          done
          echo "::error::npm does not show $VERSION after 45 minutes — not tagging; tag v$VERSION by hand once it does"
          exit 1

  tag:
    needs: [build, publish]
    if: ${{ always() && needs.publish.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"
