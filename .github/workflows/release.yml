name: Release

# Started by bin/release. npm trusts this file by name (trusted publishing), so there is no npm
# token anywhere in this repository and renaming the file breaks publishing until npm is told.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and npm publish --dry-run, which still asks npm for the publish token; publish and tag nothing"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    # npm's trusted publisher entry names this environment, as max-cli's does; without it npm
    # answers the token exchange with "package not found" (BUG-57).
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's own guidance for release builds: no cache that could carry credentials in.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2

      - name: version not yet on npm
        if: ${{ !inputs.dry_run }}
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if npm view "@leemour/cli-core@$version" version --prefer-online >/dev/null 2>&1; then
            echo "::error::$version is already on npm — raise the version first"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:bun

      # npm, not pnpm: npm's trusted publishing is the documented path, and this package has no
      # workspace: dependencies for pnpm to rewrite.
      - run: npm publish --access public ${{ inputs.dry_run && '--dry-run --loglevel verbose' || '' }}

      - name: wait for npm to show the version
        if: ${{ !inputs.dry_run }}
        run: |
          # The version's own document, not `npm view`: on 2026-10-01 the document answered while the
          # version list `npm view` reads was still stale, and two releases went untagged.
          for _ in $(seq 90); do
            curl -sfo /dev/null "https://registry.npmjs.org/@leemour%2fcli-core/$VERSION" && exit 0
            sleep 10
          done
          echo "::error::npm does not show $VERSION after fifteen minutes — not tagging; tag v$VERSION by hand once it does"
          exit 1

      - name: tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"
