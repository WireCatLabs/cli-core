name: Monthly validation

on:
  schedule:
    - cron: "38 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@cf062593aef1ff61e7eb0db485fdc3aad82a2fcd # v0.97.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","python","c-cpp","java-kotlin"]'
