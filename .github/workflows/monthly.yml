name: Monthly validation

on:
  schedule:
    - cron: "38 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@29f6679fe6f90c335d0d1d080cbddeb1ba86fa7e # v1.0.0-rc.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","python","c-cpp","java-kotlin"]'
