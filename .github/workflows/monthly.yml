name: Monthly validation

on:
  schedule:
    - cron: "38 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@92f177f38b68ad8fa5eda46f72815648e211c795 # v0.98.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","python","c-cpp","java-kotlin"]'
