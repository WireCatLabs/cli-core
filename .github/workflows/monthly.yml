name: Monthly validation

on:
  schedule:
    - cron: "38 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@cb349a6067c68f53d5371ec6bc2f4e4dd8b167e9 # v0.113.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","python","c-cpp","java-kotlin"]'
