name: Shared standards

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only bin/release edits CHANGELOG.md
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/changelog-release-only.sh "$BASE_SHA" "$HEAD_SHA" "$HEAD_REF"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm standards:check
      - run: pnpm docs:lint
      # Lint and types run in `validation / ci / check`, secrets in `security / secrets`, on every pull request and in
      # the merge queue: each check in one place (WC-CI-3, NEED-2 on #3386).
