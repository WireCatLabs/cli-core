name: Native runtime
# Core's own path to native ONNX Runtime on each system it ships for: models download installs the library, the tiny
# test models load and give the same numbers as through WebAssembly. Where Core offers no native library (musl), it
# must offer none and stay on WebAssembly. It downloads the real library, so it runs when that path changes.
on:
  pull_request:
    paths:
      - "src/embeddings/**"
      - "src/services/model-downloads.ts"
      - "package.json"
      - ".github/workflows/native-runtime.yml"
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/embeddings/onnx-runtime.native.test.ts
        env:
          NATIVE_RUNTIME_CHECK: native

  musl:
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm vitest run src/embeddings/onnx-runtime.native.test.ts
        env:
          NATIVE_RUNTIME_CHECK: none
