name: Pull request security checks

# zizmor, gitleaks and CodeQL of the workflows on every pull request, through the same reusable workflow as the
# release's own `checks`, minus the npm audits, which read the registry and stay in the release. CodeQL of the code
# runs only at release (PERF-105, NEED-2596): it was the slowest check of every pull request.
on:
  pull_request:

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only actions on a pull request; the release and the monthly run analyse every language.
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      analyze: ${{ steps.pick.outputs.analyze }}
      unchanged: ${{ steps.pick.outputs.unchanged }}
      reuse: ${{ steps.decide.outputs.reuse }}
      base: ${{ steps.decide.outputs.base }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
      pr: ${{ steps.decide.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Only the changelog and the version changed against a main proven green: nothing to analyse, as in pr.yml.
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_REPORT: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: bash scripts/ci-unchanged.sh
      - id: pick
        env:
          # Their token cannot write check runs, so they analyse everything.
          CAN_REPORT: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          analyze='"actions"' unchanged='"javascript-typescript","python","c-cpp","java-kotlin"'
          if [ "$CAN_REPORT" != true ]; then
            analyze="$analyze,$unchanged" unchanged=""
          fi
          echo "analyze=[$analyze]" >>"$GITHUB_OUTPUT"
          echo "unchanged=[$unchanged]" >>"$GITHUB_OUTPUT"
          echo "analyse [$analyze]; unchanged [$unchanged]"

  security:
    needs: languages
    if: needs.languages.outputs.reuse != 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@92f177f38b68ad8fa5eda46f72815648e211c795 # v0.98.0
    with:
      dependencies: false
      languages: ${{ needs.languages.outputs.analyze }}

  # The ruleset requires a source check per language; the languages left to the release pass here.
  not-analysed:
    needs: languages
    if: needs.languages.outputs.reuse == 'true' || needs.languages.outputs.unchanged != '[]'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UNCHANGED: ${{ needs.languages.outputs.unchanged }}
          TITLE: Not analysed here — CodeQL analyses the code at release
          SUMMARY: >-
            CodeQL analyses only the workflows of a pull request. The release analyses every language before it
            publishes, and the monthly validation does too.
        if: needs.languages.outputs.reuse != 'true'
        run: jq -r '.[] | "security / source (\(.))"' <<<"$UNCHANGED" | bash scripts/ci-pass-checks.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_PREFIX: "security / "
          TITLE: Not run — only the changelog and the version changed
          SUMMARY: >-
            Apart from CHANGELOG.md, the changes/ fragments and package.json's version, this pull request's tree is
            ${{ needs.languages.outputs.fingerprint }}, the same as main at ${{ needs.languages.outputs.base }},
            whose pull request #${{ needs.languages.outputs.pr }} passed every required check on that tree.
        if: needs.languages.outputs.reuse == 'true'
        run: bash scripts/ci-pass-checks.sh
