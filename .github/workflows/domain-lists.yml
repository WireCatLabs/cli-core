name: Domain lists
# Builds the domain-list pack (scripts/domain-lists.ts) and publishes it as assets of the release
# `domain-lists-<date>`, then points the release `domain-lists` at it by replacing its manifest.json. The CLIs read
# that manifest (`domain-lists update`). Neither release is ever marked Latest: that stays the package's.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the pack as a release (off: build and keep it as a workflow artifact only)"
        type: boolean
        default: true

concurrency:
  group: domain-lists
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node --max-old-space-size=4096 --experimental-strip-types scripts/domain-lists.ts pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domain-lists
          path: pack/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: domain-lists
          path: pack
      - name: publish the dated release, then move the pointer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          version=$(jq -r .version pack/manifest.json)
          {
            echo "Domain lists ${version}, built by scripts/domain-lists.ts. Download with \`domain-lists update\`."
            echo
            echo "| Source | Signal | Lines | Licence | Class | Credit |"
            echo "|---|---|---|---|---|---|"
            jq -r '.sources[] | "| \(.title) | \(.signal) | \(.count // "fetched from the source") | [\(.licence)](\(.licence_url)) | \(.class) | \(.attribution) |"' pack/manifest.json
          } > notes.md
          tag="domain-lists-${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" pack/* --clobber
          else
            gh release create "$tag" pack/* --target "$TARGET" --latest=false --title "Domain lists ${version}" --notes-file notes.md
          fi
          if ! gh release view domain-lists > /dev/null 2>&1; then
            gh release create domain-lists --target "$TARGET" --latest=false --title "Domain lists (newest)" \
              --notes "Holds only manifest.json, which points at the newest dated domain-lists release."
          fi
          gh release upload domain-lists pack/manifest.json --clobber
