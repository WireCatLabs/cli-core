name: SQLite
# Builds @wirecat/cli-core-sqlite (packages/sqlite) — SQLite and the sqlite-vec extension — checks every
# library on the systems it is for, and publishes it when started by hand with `publish` — npm trusts this file by name.
on:
  schedule:
    - cron: "37 3 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the package to npm"
        type: boolean
        default: false

permissions: {}

env:
  SQLITE_VERSION: 3.53.4
  # The oldest glibc the gnu libraries load on: manylinux_2_28 (AlmaLinux 8, RHEL 8, Debian 11+).
  GLIBC_FLOOR: "2.28"

jobs:
  security:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@46d997062ff444708c4251331dc4e6ab216a6d03 # v0.47.5
    with:
      languages: '["actions","javascript-typescript","c-cpp"]'

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-gnu, runner: ubuntu-latest, image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { target: linux-arm64-gnu, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64 }
          - { target: linux-x64-musl, runner: ubuntu-latest, image: alpine:3.20 }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, image: alpine:3.20 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In `docker run`, not `container:`: JavaScript actions do not run in Alpine containers.
      - name: build
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
            if command -v apk >/dev/null; then apk add --no-cache build-base curl unzip >/dev/null
            else dnf install -y unzip >/dev/null; fi
            packages/sqlite/build.sh ${{ matrix.target }}'
      - name: exports what Node imports
        run: packages/sqlite/check.sh packages/sqlite/lib/${{ matrix.target }}/libsqlite3.so.0 ${{ endsWith(matrix.target, 'gnu') && env.GLIBC_FLOOR || '' }}
      - name: the extension exports its entry point
        run: packages/sqlite/check.sh packages/sqlite/lib/${{ matrix.target }}/vec0.so ${{ endsWith(matrix.target, 'gnu') && env.GLIBC_FLOOR || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: packages/sqlite/lib/${{ matrix.target }}
          if-no-files-found: error

  darwin:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packages/sqlite/build.sh darwin
      - name: loads on macOS 13 and later, both architectures, signed
        run: |
          for library in packages/sqlite/lib/darwin/libsqlite3.dylib packages/sqlite/lib/darwin/vec0.dylib; do
            lipo -archs "$library" | grep -qw arm64
            lipo -archs "$library" | grep -qw x86_64
            for arch in arm64 x86_64; do
              vtool -arch "$arch" -show-build "$library" | grep -q "minos 13.0"
            done
            codesign -v "$library"
          done
      - run: packages/sqlite/check.sh packages/sqlite/lib/darwin/libsqlite3.dylib
      - run: packages/sqlite/check.sh packages/sqlite/lib/darwin/vec0.dylib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin
          path: packages/sqlite/lib/darwin
          if-no-files-found: error

  # Only the extension: Node on Windows has SQLite built in. MinGW's gcc from the runner image, so one
  # source and one build script serve every platform.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packages/sqlite/build.sh win32-x64
      - name: Node loads it
        run: node packages/sqlite/probe.mjs - "$(node -p process.versions.sqlite)" "$PWD/packages/sqlite/lib/win32-x64/vec0.dll"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-x64
          path: packages/sqlite/lib/win32-x64
          if-no-files-found: error

  pack:
    needs: [linux, darwin, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/sqlite/lib
      - run: cd packages/sqlite && npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: packages/sqlite/wirecat-cli-core-sqlite-*.tgz
          if-no-files-found: error

  # The library as installed — unpacked from the tarball — under Bun, which loads it itself.
  macos:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: tar -xzf wirecat-cli-core-sqlite-*.tgz
      - run: sw_vers -productVersion && uname -m
      - run: bun packages/sqlite/probe.mjs "$PWD/package/lib/darwin/libsqlite3.dylib" "$SQLITE_VERSION" "$PWD/package/lib/darwin/vec0.dylib"

  # A distribution's Node, which takes the system library, started on ours instead.
  distributions:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: "ubuntu:26.04", target: linux-x64-gnu }
          - { runner: ubuntu-24.04-arm, image: "ubuntu:26.04", target: linux-arm64-gnu }
          - { runner: ubuntu-latest, image: "fedora:43", target: linux-x64-gnu }
          - { runner: ubuntu-latest, image: "alpine:3.22", target: linux-x64-musl }
          - { runner: ubuntu-24.04-arm, image: "alpine:3.22", target: linux-arm64-musl }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: tar -xzf wirecat-cli-core-sqlite-*.tgz
      - run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
            if command -v apk >/dev/null; then apk add --no-cache nodejs >/dev/null
            elif command -v dnf >/dev/null; then dnf install -y nodejs >/dev/null
            else apt-get update >/dev/null && apt-get install -y nodejs >/dev/null; fi
            LD_LIBRARY_PATH=/w/package/lib/${{ matrix.target }} node packages/sqlite/probe.mjs - ${{ env.SQLITE_VERSION }} /w/package/lib/${{ matrix.target }}/vec0.so'

  publish:
    needs: [macos, distributions, security]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm publish wirecat-cli-core-sqlite-*.tgz --access public --provenance
