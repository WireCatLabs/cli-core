# pnpm blocks dependencies' install scripts by default, so esbuild never unpacks its platform
# binary and vitest fails at startup. Since pnpm 11 the key is `allowBuilds` here, with an explicit
# boolean per package.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - "@wirecat/*"

overrides:
  # markdownlint 0.42.0 (its latest) pins re2js 2.8.6 exactly (GHSA-gg6h-894w-4m9c).
  markdownlint>re2js: 2.8.7
  "@types/pngjs>@types/node": 22.20.5
  mammoth>argparse: 2.0.1
  micromark-extension-math>katex: 0.18.2
  "vite@>=8.3.0 <8.3.3": ^8.3.5
